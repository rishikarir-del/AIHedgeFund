# Local development dependencies for ARF-OS.
#
# CLAUDE.md section 21.2 requires integration tests to run against real
# PostgreSQL and Redis rather than fakes, so these are not optional extras --
# milestones 3 onward cannot be verified without them.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Values match .env.example. Nothing here is production configuration: the
# credentials are local-only placeholders and the services bind to localhost.

name: arf-os

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arfos
      POSTGRES_PASSWORD: arfos
      POSTGRES_DB: arfos
      # Deterministic collation so ORDER BY results do not vary by host locale.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arfos -d arfos']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires keyspace notifications for delayed and repeatable jobs.
    command: ['redis-server', '--appendonly', 'yes', '--notify-keyspace-events', 'Ex']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for raw TradingView uploads, Pine bundles and
  # compressed equity series (CLAUDE.md section 9.1).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: arfos
      MINIO_ROOT_PASSWORD: arfos-local-dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the artefact bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 arfos arfos-local-dev &&
      mc mb --ignore-existing local/arfos-artefacts &&
      mc anonymous set none local/arfos-artefacts
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
